<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="12" fill="#0e2f49"/>
  <!-- Georgian gatehouse portico: pediment, columns, steps -->
  <g fill="#ffffff">
    <!-- pediment (triangular roof) -->
    <path d="M32 13 L51 28 H13 Z"/>
    <!-- architrave / entablature bar -->
    <rect x="14" y="29.5" width="36" height="3.5"/>
    <!-- columns -->
    <rect x="17" y="34" width="2.6" height="12"/>
    <rect x="23.4" y="34" width="2.6" height="12"/>
    <rect x="30.7" y="34" width="2.6" height="12"/>
    <rect x="38" y="34" width="2.6" height="12"/>
    <rect x="44.4" y="34" width="2.6" height="12"/>
    <!-- steps / base -->
    <rect x="15" y="46.5" width="34" height="2.8"/>
    <rect x="12" y="49.8" width="40" height="3"/>
  </g>
</svg>
